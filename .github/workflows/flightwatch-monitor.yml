name: Anywhere With You hourly monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Anywhere With You monitoring
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.FLIGHTWATCH_URL }}/api/cron/check"
